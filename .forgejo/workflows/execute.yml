name: Execute

on:
  schedule:
    - cron: '0 18 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
    - name: Run
      run: uv run build.py
    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: Update README
        file_pattern: README.md
        commit_user_name: Forgejo
        commit_user_email: git+bot@theorangeone.net
        commit_author: Forgejo <git+bot@theorangeone.net>
